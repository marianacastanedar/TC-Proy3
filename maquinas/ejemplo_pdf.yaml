# Ejemplo del enunciado, con solo dos transiciones a propósito.
# Sirve para probar el parser, no para aceptar ninguna cadena (está incompleta).
q_states:
  q_list: ['0', '1', '2', '3', '4', '5']
  initial: '0'
  final: '5'
alphabet:
  - a
  - b
  - '#'
tape_alphabet:
  - X
  - '#'
  -            # blank
delta:
  - params:
      initial_state: '0'
      mem_cache_value:          # blank
      tape_input: a
    output:
      final_state: '1'
      mem_cache_value: a
      tape_output:              # blank
      tape_displacement: R
  - params:
      initial_state: '1'
      mem_cache_value: a
      tape_input: b
    output:
      final_state: '0'
      mem_cache_value: a
      tape_output: a
      tape_displacement: R
simulation_strings:
  - aab#aab
  - ab#ab
  - abbababa#aba
