# Máquina alteradora: invierte una cadena w en {a, b}*, deja w^R en la cinta.
#
# Idea general: primero pone un '#' justo después de w, como separador entre
# la w original y la copia invertida que se va a ir armando a la derecha.
# Luego, una y otra vez: busca el último símbolo de w que todavía no se copió,
# lo marca con X y lo guarda en la caché, viaja a la derecha (pasando encima de
# X, #, a y b) hasta el blank del final, y ahí escribe el símbolo guardado.
# Al terminar de copiar toda w, borra las X y el '#' y queda w^R en la cinta.
# Esta es la máquina que de verdad usa la caché del estado (estado, cache).
#
# Estados:
#   q0 -> camina a la derecha hasta el final de w y pone el '#'
#   q1 -> busca, yendo a la izquierda, el último símbolo de w sin copiar
#   q2 -> ya guardó un símbolo en la caché, viaja a la derecha a escribirlo
#   q3 -> ya escribió el símbolo, regresa hasta el '#' para repetir
#   q4 -> ya copió todo w: borra las marcas X y el separador '#'
#   q5 -> estado final, la cadena se acepta
q_states:
  q_list: ['q0', 'q1', 'q2', 'q3', 'q4', 'q5']
  initial: 'q0'
  final: 'q5'
alphabet:
  - a
  - b
tape_alphabet:
  - a
  - b
  - X
  - '#'
  -            # blank
delta:
  - params: {initial_state: 'q0', mem_cache_value: , tape_input: a}
    output: {final_state: 'q0', mem_cache_value: , tape_output: a, tape_displacement: R}
  - params: {initial_state: 'q0', mem_cache_value: , tape_input: b}
    output: {final_state: 'q0', mem_cache_value: , tape_output: b, tape_displacement: R}
  - params: {initial_state: 'q0', mem_cache_value: , tape_input: }
    output: {final_state: 'q1', mem_cache_value: , tape_output: '#', tape_displacement: L}
  - params: {initial_state: 'q1', mem_cache_value: , tape_input: X}
    output: {final_state: 'q1', mem_cache_value: , tape_output: X, tape_displacement: L}
  - params: {initial_state: 'q1', mem_cache_value: , tape_input: a}
    output: {final_state: 'q2', mem_cache_value: a, tape_output: X, tape_displacement: R}
  - params: {initial_state: 'q1', mem_cache_value: , tape_input: b}
    output: {final_state: 'q2', mem_cache_value: b, tape_output: X, tape_displacement: R}
  - params: {initial_state: 'q1', mem_cache_value: , tape_input: }
    output: {final_state: 'q4', mem_cache_value: , tape_output: , tape_displacement: R}
  # q2 con cache = a: viaja a la derecha cargando la 'a' que hay que copiar
  - params: {initial_state: 'q2', mem_cache_value: a, tape_input: X}
    output: {final_state: 'q2', mem_cache_value: a, tape_output: X, tape_displacement: R}
  - params: {initial_state: 'q2', mem_cache_value: a, tape_input: '#'}
    output: {final_state: 'q2', mem_cache_value: a, tape_output: '#', tape_displacement: R}
  - params: {initial_state: 'q2', mem_cache_value: a, tape_input: a}
    output: {final_state: 'q2', mem_cache_value: a, tape_output: a, tape_displacement: R}
  - params: {initial_state: 'q2', mem_cache_value: a, tape_input: b}
    output: {final_state: 'q2', mem_cache_value: a, tape_output: b, tape_displacement: R}
  - params: {initial_state: 'q2', mem_cache_value: a, tape_input: }
    output: {final_state: 'q3', mem_cache_value: , tape_output: a, tape_displacement: L}
  # q2 con cache = b: viaja a la derecha cargando la 'b' que hay que copiar
  - params: {initial_state: 'q2', mem_cache_value: b, tape_input: X}
    output: {final_state: 'q2', mem_cache_value: b, tape_output: X, tape_displacement: R}
  - params: {initial_state: 'q2', mem_cache_value: b, tape_input: '#'}
    output: {final_state: 'q2', mem_cache_value: b, tape_output: '#', tape_displacement: R}
  - params: {initial_state: 'q2', mem_cache_value: b, tape_input: a}
    output: {final_state: 'q2', mem_cache_value: b, tape_output: a, tape_displacement: R}
  - params: {initial_state: 'q2', mem_cache_value: b, tape_input: b}
    output: {final_state: 'q2', mem_cache_value: b, tape_output: b, tape_displacement: R}
  - params: {initial_state: 'q2', mem_cache_value: b, tape_input: }
    output: {final_state: 'q3', mem_cache_value: , tape_output: b, tape_displacement: L}
  - params: {initial_state: 'q3', mem_cache_value: , tape_input: a}
    output: {final_state: 'q3', mem_cache_value: , tape_output: a, tape_displacement: L}
  - params: {initial_state: 'q3', mem_cache_value: , tape_input: b}
    output: {final_state: 'q3', mem_cache_value: , tape_output: b, tape_displacement: L}
  - params: {initial_state: 'q3', mem_cache_value: , tape_input: '#'}
    output: {final_state: 'q1', mem_cache_value: , tape_output: '#', tape_displacement: L}
  - params: {initial_state: 'q4', mem_cache_value: , tape_input: X}
    output: {final_state: 'q4', mem_cache_value: , tape_output: , tape_displacement: R}
  - params: {initial_state: 'q4', mem_cache_value: , tape_input: '#'}
    output: {final_state: 'q5', mem_cache_value: , tape_output: , tape_displacement: R}
simulation_strings:
  - aabbb
  - abbab
  - baaabb
  - aaaaab
